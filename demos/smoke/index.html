<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Era Widgets — smoke</title>
  <link rel="stylesheet" href="../../packages/css/dist/era-widgets.css" />
  <style>
    body { margin: 0; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid color-mix(in oklch, currentColor 20%, transparent);
      font-family: system-ui, sans-serif;
    }
    .toolbar label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
    main { padding: 24px; display: grid; gap: 24px; max-width: 720px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  </style>
</head>
<body class="ew-root" data-era="neutral" data-mode="light" data-fidelity="40">
  <div class="toolbar">
    <strong>Era Widgets smoke</strong>
    <label>era
      <select id="era">
        <option value="neutral">neutral</option>
        <option value="deco">deco</option>
        <option value="mcm-atomic">mcm-atomic</option>
        <option value="neon">neon</option>
      </select>
    </label>
    <label>mode
      <select id="mode">
        <option value="light">light</option>
        <option value="dark">dark</option>
      </select>
    </label>
    <label>fidelity
      <input id="fidelity" type="range" min="0" max="100" value="40" />
      <span id="fid-val">40</span>
    </label>
  </div>
  <main>
    <article class="ew-card" data-variant="raised">
      <header class="ew-card__header"><h2>Hero widgets</h2></header>
      <div class="ew-card__body">
        <p>Flip <code>data-era</code> — markup stays neutral. Styling is Phase 0 generated CSS (partial OK).</p>
        <div class="row">
          <button type="button" class="ew-button">Primary</button>
          <button type="button" class="ew-button" data-variant="secondary">Secondary</button>
          <button type="button" class="ew-button" data-variant="ghost">Ghost</button>
          <button type="button" class="ew-button" data-variant="danger">Danger</button>
        </div>
      </div>
      <footer class="ew-card__footer">
        <button type="button" class="ew-button" id="open-dialog">Open dialog</button>
      </footer>
    </article>

    <div class="ew-text-field">
      <label class="ew-text-field__label" for="email">Email</label>
      <input id="email" class="ew-text-field__control" type="email" autocomplete="email" placeholder="you@example.com" />
      <p class="ew-text-field__description">Native input; eras skin chrome only.</p>
    </div>

    <label class="ew-switch">
      <input class="ew-switch__control" type="checkbox" role="switch" aria-checked="false" id="sw" />
      <span class="ew-switch__track" aria-hidden="true"><span class="ew-switch__thumb"></span></span>
      <span class="ew-switch__label">Notifications</span>
    </label>

    <div class="ew-tabs">
      <div role="tablist" aria-label="Plans">
        <button type="button" role="tab" id="t-basic" aria-selected="true" aria-controls="p-basic">Basic</button>
        <button type="button" role="tab" id="t-pro" aria-selected="false" aria-controls="p-pro" tabindex="-1">Pro</button>
      </div>
      <div role="tabpanel" id="p-basic" aria-labelledby="t-basic">Basic plan body</div>
      <div role="tabpanel" id="p-pro" aria-labelledby="t-pro" hidden>Pro plan body</div>
    </div>
  </main>

  <dialog class="ew-dialog" id="dlg" aria-labelledby="dlg-title">
    <header class="ew-dialog__header"><h2 id="dlg-title">Sign up</h2></header>
    <div class="ew-dialog__body"><p>Native <code>&lt;dialog&gt;</code> — showModal().</p></div>
    <footer class="ew-dialog__footer">
      <button type="button" class="ew-button" data-variant="ghost" id="close-dialog">Cancel</button>
      <button type="button" class="ew-button">Continue</button>
    </footer>
  </dialog>

  <script>
    const root = document.body;
    const era = document.getElementById('era');
    const mode = document.getElementById('mode');
    const fidelity = document.getElementById('fidelity');
    const fidVal = document.getElementById('fid-val');
    era.addEventListener('change', () => root.dataset.era = era.value);
    mode.addEventListener('change', () => root.dataset.mode = mode.value);
    fidelity.addEventListener('input', () => {
      root.dataset.fidelity = fidelity.value;
      fidVal.textContent = fidelity.value;
    });
    const sw = document.getElementById('sw');
    sw.addEventListener('change', () => sw.setAttribute('aria-checked', String(sw.checked)));
    document.getElementById('open-dialog').addEventListener('click', () => document.getElementById('dlg').showModal());
    document.getElementById('close-dialog').addEventListener('click', () => document.getElementById('dlg').close());
    // Minimal tabs keyboard stub for smoke (full WC in Phase 1)
    const tabs = [...document.querySelectorAll('[role=tab]')];
    tabs.forEach((tab) => tab.addEventListener('click', () => {
      tabs.forEach((t) => {
        const on = t === tab;
        t.setAttribute('aria-selected', String(on));
        t.tabIndex = on ? 0 : -1;
        document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
      });
    }));
  </script>
</body>
</html>
