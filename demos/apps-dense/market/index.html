<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market</title>
<link rel="stylesheet" href="../../../packages/css/dist/era-widgets.css">
<link rel="stylesheet" href="../shared/layout.css">
<script src="../../../packages/elements/dist/era-elements.js" defer></script>
<script src="../shared/switch.js" defer></script>
</head>
<body>
<div class="ew-root" data-groovster-root data-era="groovy" data-mode="light" data-fidelity-band="whisper" data-density="compact">
  <header class="ew-toolbar" role="toolbar" aria-label="Market">
    <div class="ew-toolbar__start"><h1 class="ew-title--page">Harbor Lot</h1></div>
    <div class="ew-toolbar__center">
      <search class="ew-search" role="search">
        <label class="ew-select">
          <span class="ew-select__label">Scope</span>
          <select class="ew-select__control ew-search__scope" aria-label="Search scope">
            <option>All lots</option>
            <option>Lamps</option>
          </select>
        </label>
        <input class="ew-text-field__control ew-search__control" type="search" aria-label="Search lots">
      </search>
    </div>
    <div class="ew-toolbar__end"><div data-era-switch></div></div>
  </header>
  <div class="market">
    <div class="cards">
      <article class="ew-card is-selected">
        <header class="ew-card__header"><h2 class="ew-card__title">Brass lamp with a very long lot title that must wrap inside the card</h2></header>
        <div class="ew-card__body"><p>$48 · 4 bids</p></div>
        <footer class="ew-card__footer"><button type="button" class="ew-button">Bid</button></footer>
      </article>
      <article class="ew-card">
        <header class="ew-card__header"><h2 class="ew-card__title">Oak chair</h2></header>
        <div class="ew-card__body"><p>$30 · 1 bid</p></div>
        <footer class="ew-card__footer"><button type="button" class="ew-button" data-variant="secondary">Watch</button></footer>
      </article>
      <article class="ew-card">
        <header class="ew-card__header"><h2 class="ew-card__title ew-card__title--truncate">Typewriter ribbon tin from the Cedar Stair desk drawer</h2></header>
        <div class="ew-card__body"><p>$12</p></div>
        <footer class="ew-card__footer"><button type="button" class="ew-button" data-variant="secondary">Watch</button></footer>
      </article>
    </div>
    <article class="ew-card ew-card--quiet">
      <header class="ew-card__header"><h2 class="ew-title--panel">Brass lamp</h2></header>
      <div class="ew-card__body">
        <p>Working socket. Shade is later.</p>
        <div class="ew-table-scroll">
          <table class="ew-table" data-responsive="stack" data-zebra="true">
            <caption>Specifics</caption>
            <thead><tr><th aria-sort="ascending">Detail</th><th>Value</th></tr></thead>
            <tbody>
              <tr><td data-label="Detail">Material</td><td data-label="Value">Brass</td></tr>
              <tr class="is-selected" aria-selected="true"><td data-label="Detail">Height</td><td data-label="Value">16 in</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </article>
  </div>
</div>
</body>
</html>
