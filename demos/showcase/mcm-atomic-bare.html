<!DOCTYPE html>
<html lang="en" data-era="mcm-atomic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atomic bare — costume default smoke</title>
  <link rel="stylesheet" href="../../packages/css/dist/era-widgets.css">
</head>
<body>
  <!-- Intentionally no data-fidelity-band: costume must apply by default -->
  <div class="ew-backdrop" aria-hidden="true"></div>
  <section class="ew-hero">
    <div class="ew-hero__stage" aria-hidden="true">
      <div class="ew-hero__twotone"></div>
      <div class="ew-hero__starbursts"></div>
      <div class="ew-hero__arch"></div>
      <div class="ew-orbit"></div>
    </div>
    <div class="ew-hero__content">
      <p class="ew-script">Fabulous</p>
      <h1 class="ew-hero__title">Atomic</h1>
      <p class="ew-hero__subtitle">Bare page: only data-era is set. Costume motifs come from the library.</p>
      <div class="ew-hero__cta">
        <button type="button" class="ew-button">Primary</button>
        <button type="button" class="ew-button" data-variant="secondary">Secondary</button>
      </div>
    </div>
  </section>
  <main style="max-width:720px;margin:32px auto;padding:0 20px;display:grid;gap:20px">
    <div class="ew-card">
      <div class="ew-card__header"><h3>Formica counter</h3></div>
      <div class="ew-card__body"><p>Turquoise header band, charcoal outline, kidney corners.</p></div>
    </div>
    <label class="ew-switch">
      <input class="ew-switch__control" type="checkbox" role="switch" />
      <span class="ew-switch__track" aria-hidden="true"><span class="ew-switch__thumb"></span></span>
      <span class="ew-switch__label">Night mode tour</span>
    </label>
  </main>
</body>
</html>
