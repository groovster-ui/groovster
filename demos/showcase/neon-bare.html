<!DOCTYPE html>
<html lang="en" data-era="neon" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon bare — costume default smoke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Monoton&family=Mr+Dafoe&family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../packages/css/dist/era-widgets.css">
  <script src="../../packages/elements/dist/era-elements.js"></script>
  <style>
    body { margin: 0; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 48px 24px; }
  </style>
</head>
<body>
  <!-- Intentionally no data-fidelity-band: costume must apply by default -->
  <section class="ew-hero">
    <div class="ew-hero__grid" aria-hidden="true"></div>
    <div class="ew-hero__sun" aria-hidden="true"></div>
    <div class="ew-hero__mountains" aria-hidden="true"></div>
    <div class="ew-hero__scanlines" aria-hidden="true"></div>
    <div class="ew-hero__content">
      <h1 class="ew-hero__title">Bare Neon</h1>
      <p class="ew-script">Default</p>
      <p class="ew-hero__subtitle">Costume without a band attribute</p>
      <div class="ew-hero__cta">
        <button type="button" class="ew-button">Primary</button>
      </div>
    </div>
  </section>
  <div class="wrap">
    <h2 class="ew-section-heading">Surfaces</h2>
    <div class="ew-card">
      <div class="ew-card__header"><h3>Tube card</h3></div>
      <div class="ew-card__body">
        <p>Grid, sun, mountains, and chrome type appear from costume defaults. Glow is cosmetic.</p>
        <label class="ew-text-field">
          <span class="ew-text-field__label">Callsign</span>
          <input class="ew-text-field__control" type="text" value="rider">
        </label>
      </div>
    </div>
  </div>
</body>
</html>
