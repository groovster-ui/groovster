name: Bug Report
description: Report a bug or unexpected behavior in Era Widgets
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run 'pnpm gen'
        2. Open 'demos/smoke/index.html'
        3. Switch to 'deco' era
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component (if applicable)
      description: Which component is affected?
      options:
        - button
        - card
        - dialog
        - tabs
        - switch
        - text-field
        - menu
        - popover
        - tooltip
        - slider
        - toast
        - select
        - Other / Not applicable
    validations:
      required: false

  - type: dropdown
    id: era
    attributes:
      label: Era (if applicable)
      description: Which era does this affect?
      options:
        - neutral
        - deco
        - mcm-atomic
        - neon
        - memphis
        - groovy
        - swiss
        - bauhaus
        - art-nouveau
        - All eras
        - Not applicable
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Era Widgets are you using?
      placeholder: "0.1.0-alpha.0"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS: macOS 13.0
        - Node: 20.10.0
        - pnpm: 9.15.9
        - Browser (if applicable): Chrome 120
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or code samples
      placeholder: Screenshots, error logs, code samples...
    validations:
      required: false
