name: era-widgets-check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Run validation checks
        run: pnpm check

      - name: Build and typecheck React
        run: pnpm react:build && pnpm react:typecheck

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -e "
            const fs = require('fs');
            const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
            const match = lock.match(/^ {2}playwright@([^:]+):/m);
            if (!match) {
              throw new Error('playwright version not found in pnpm-lock.yaml');
            }
            process.stdout.write(match[1]);
          ")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: tools/a11y

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: tools/a11y

      - name: Unit tests
        run: pnpm test:unit

      - name: Package size check
        run: pnpm sizes:check

      - name: Fail on generated drift after gen
        run: pnpm gen && git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Typecheck React package
        run: pnpm react:typecheck

      - name: Run MCP smoke tests
        run: pnpm mcp:smoke

      - name: Run eval harness self-tests
        run: pnpm eval
      
      - name: Run React interaction tests
        run: pnpm test:react

      - name: Run web component lifecycle tests
        run: pnpm test:elements

      - name: Run accessibility tests
        run: pnpm test:a11y

      - name: Run recipe site checks
        run: pnpm test:sites

      - name: Verify Swiss and Bauhaus browser demos
        run: node scripts/modernist-browser.mjs

      - name: Run website instruction harness
        run: pnpm eval:sites

      - name: Install packed packages outside the workspace
        run: pnpm test:packages

      - name: Registry e2e
        run: pnpm registry:e2e
