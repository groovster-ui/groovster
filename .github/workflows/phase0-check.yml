name: era-widgets-check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm no-imports
      - run: pnpm mcp:smoke
      - run: pnpm eval
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: tools/a11y
      - run: pnpm test:a11y
