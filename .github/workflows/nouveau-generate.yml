name: Temporary Art Nouveau assets
on:
  push:
    branches: [feat/art-nouveau-first-class-era-20261122]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/nouveau-browser.mjs --capture
      - name: Commit generated files and representative screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/css/dist packages/tokens/dist packages/mcp/data registry generated skills/groovster/references packages/react llms.txt demos/reference/shots/nouveau
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate Art Nouveau distributions and visual references"
            git push origin HEAD
          fi
