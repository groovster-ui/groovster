name: Temporary modernist generated artifacts
on:
  push:
    branches: [feat/swiss-bauhaus-era-systems-20261122]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - name: Commit deterministic generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/css/dist packages/tokens/dist packages/mcp/data registry generated skills/groovster/references packages/react llms.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate Swiss and Bauhaus assets"
            git push
          fi
